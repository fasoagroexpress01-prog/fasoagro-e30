<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e3b1a"><link rel="icon" href="icon-192.png"><title>FasoAgro-Express · Enregistrement E30</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f8f3;--sf:#fff;--tx:#14261a;--mu:#5b6b5f;--g:#1f7a2e;--gd:#0e3b1a;--o:#ee7a10;--bd:#d6dfd2;--er:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a12;--sf:#172419;--tx:#e8efe6;--mu:#9fb0a3;--g:#4fb560;--gd:#cfe8d2;--bd:#2c3d2f;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1a12;--sf:#172419;--tx:#e8efe6;--mu:#9fb0a3;--g:#4fb560;--gd:#cfe8d2;--bd:#2c3d2f;--er:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.01em}
header{background:var(--gd);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--o);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
@media (prefers-color-scheme:dark){header{color:#0f1a12}}
header img{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover}
header h1{font-size:22px;line-height:1}
header small{opacity:.85;font-size:13px}
header button{margin-left:auto}
main{max-width:640px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font:600 15px Barlow,sans-serif}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:16px Barlow,sans-serif}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--o);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--o);color:#fff;font:700 18px "Barlow Condensed",sans-serif;letter-spacing:.03em;margin-top:18px}
.btn.alt{background:var(--g);margin-top:8px}
.btn.ghost{background:transparent;color:var(--g);border:1px solid var(--g)}
.sm{padding:6px 10px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font:600 13px Barlow,sans-serif}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center;background:var(--bg);font-weight:500}
.seg input{width:auto;margin-right:6px}
.eng{background:var(--bg);border-left:4px solid var(--g);padding:10px 12px;border-radius:8px;margin-top:14px;font-size:14px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}.item b{display:block}.item span{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--g);color:#fff}.tag.no{background:var(--er)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stats b{font:700 28px "Barlow Condensed",sans-serif;color:var(--g);display:block}
.stats span{font-size:12px;color:var(--mu)}
.msg{color:var(--er);font-size:14px;min-height:18px;margin-top:8px}
.ok{color:var(--g)}
.hide{display:none}
textarea{height:150px;font:12px monospace}
.login{max-width:380px;margin:8vh auto 0;text-align:center}
.login img{width:200px;max-width:70%}
.login form{text-align:left}
.tag.wait{background:var(--o)}.item .mo{color:var(--er);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}
.act{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:150px}.act input{padding:7px;font-size:14px}
.sec{font-size:22px;margin-bottom:6px}p.h{color:var(--mu);font-size:14px;margin:0 0 8px}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const REG=["Boucle du Mouhoun","Cascades","Centre","Centre-Est","Centre-Nord","Centre-Ouest","Centre-Sud","Est","Hauts-Bassins","Nord","Plateau-Central","Sahel","Sud-Ouest"];
REG.forEach(r=>$("reg").add(new Option(r,r)));
const ADAS=["ADA1","ADA2","ADA3","ADA4","ADA5"],ROLES=[...ADAS,"DOT","DG","PDG"];
ROLES.forEach(r=>$("u").add(new Option(r,r)));
const LAB={DOT:"Vérification des enregistrements",DG:"Supervision",PDG:"Supervision"};
const ST={A:["En attente","wait"],V:["Validé",""],C:["À corriger","no"]};
const SYNC={url:"https://script.google.com/macros/s/AKfycby9AoIDvian-QG-oPx4uGVciyabsGcBdqxEj_auzYJSdFzZ4TlzKkZa36fa37y-RI1d/exec"};let pw="";
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]??d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
let rows=store.get("e30_rows",[]),me="",editId=null,view="",fa="";
const isADA=()=>me.startsWith("ADA");
const save=()=>store.set("e30_rows",rows);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function hash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("fae30:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

function showLogin(){$("login").classList.remove("hide");$("app").classList.add("hide");upLg()}
function upLg(){const a=store.get("e30_accs",{})[$("u").value];
 $("lg-help").textContent=a?"Entrez votre mot de passe.":"Première connexion de "+$("u").value+" sur cet appareil : choisissez un mot de passe.";
 $("lg-btn").textContent=a?"Se connecter":"Créer mon accès"}
$("u").onchange=upLg;
$("lg-btn").onclick=async()=>{const id=$("u").value,p=$("p").value,m=$("lg-msg"),accs=store.get("e30_accs",{});
 if(p.length<4){m.textContent="Mot de passe de 4 caractères minimum.";return}
 const h=await hash(id+p);
 if(!accs[id]){accs[id]=h;store.set("e30_accs",accs)}else if(accs[id]!==h){m.textContent="Mot de passe incorrect.";return}
 pw=p;m.textContent="";$("p").value="";store.set("e30_sess",id);start(id)};
$("out").onclick=()=>{store.set("e30_sess","");showLogin()};

function start(id){me=id;rows=store.get("e30_rows",[]);$("login").classList.add("hide");$("app").classList.remove("hide");
 $("who").textContent=id+" · "+(isADA()?"Enregistrement des membres E30":LAB[id]);
 const T=isADA()?[["vForm","Nouveau"],["vList","Mes fiches"],["vEx","Échange"]]:id==="DOT"?[["vList","À vérifier"],["vDash","Suivi"],["vEx","Échange"]]:[["vDash","Tableau de bord"],["vList","Fiches"],["vEx","Échange"]];
 $("tabs").innerHTML=T.map(t=>'<button data-t="'+t[0]+'">'+t[1]+'</button>').join("");
 $("exh").textContent=isADA()?"Envoyez vos fiches au DOT (par WhatsApp, par exemple) : copiez le code ci-dessous.":id==="DOT"?"Renvoyez vos vérifications aux ADA et à la direction : copiez le code ci-dessous.":"Récupérez le CSV pour Excel ou partagez le code.";
 $("imh").textContent=isADA()?"Collez ici le code du DOT pour recevoir vos fiches validées ou à corriger.":id==="DOT"?"Collez ici le code envoyé par un ADA.":"Collez ici le code envoyé par le DOT.";
 $("csv").classList.toggle("hide",isADA());$("exa").classList.toggle("hide",isADA());$("exal").classList.toggle("hide",isADA());$("exa").innerHTML='<option value="">Toutes les fiches</option>'+ADAS.map(a=>'<option>'+a+'</option>').join("");
 $("syncc").classList.toggle("hide",!SYNC.url);$("spwr").classList.toggle("hide",!!pw);resetForm();go(T[0][0])}
$("tabs").onclick=e=>{if(e.target.dataset.t)go(e.target.dataset.t)};
function go(v){view=v;["vForm","vDash","vList","vEx"].forEach(x=>$(x).classList.toggle("hide",x!==v));
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===v));scrollTo(0,0);render()}

const F=["grp","dt","nom","dn","cnib","dd","vil","com","pro","reg"];
const rv=n=>(document.querySelector('input[name="'+n+'"]:checked')||{}).value||"";
function resetForm(){editId=null;F.forEach(f=>$(f).value="");$("dt").value=new Date().toISOString().slice(0,10);
 document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);
 const l=store.get("e30_last_"+me,{});["grp","vil","com","pro","reg"].forEach(f=>{if(l[f])$(f).value=l[f]});
 $("ftitle").textContent="Fiche producteur";$("save").textContent="Enregistrer le producteur";$("cancel").classList.add("hide");$("fmsg").textContent=""}
$("cancel").onclick=resetForm;
$("save").onclick=()=>{const old=rows.find(x=>x.id===editId);
 const r={id:editId||me+"-"+Date.now().toString(36),ada:old?old.ada:me,u:Date.now(),st:"A",mo:"",by:""};
 F.forEach(f=>r[f]=$(f).value.trim());r.sx=rv("sx");r.en=rv("en");
 const m=$("fmsg");m.className="msg";
 for(const[k,t]of [["grp","le nom du groupement"],["nom","le nom et prénom(s)"],["cnib","le N° CNIB"],["vil","le village ou quartier"],["com","la commune"],["pro","la province"],["reg","la région"]])if(!r[k]){m.textContent="Renseignez "+t+".";$(k).focus();return}
 if(!r.sx){m.textContent="Choisissez le sexe.";return}
 if(!r.en){m.textContent="Indiquez si le producteur accepte l’engagement.";return}
 if(rows.some(x=>x.id!==r.id&&x.cnib.toLowerCase()===r.cnib.toLowerCase())){m.textContent="Ce N° CNIB est déjà enregistré.";return}
 rows=editId?rows.map(x=>x.id===r.id?r:x):[r,...rows];save();
 store.set("e30_last_"+me,{grp:r.grp,vil:r.vil,com:r.com,pro:r.pro,reg:r.reg});
 const was=!!editId;resetForm();$("fmsg").className="msg ok";$("fmsg").textContent=was?"Fiche corrigée : elle repart en vérification.":"Producteur enregistré. Fiche suivante prête."};

function mine(){return isADA()?rows.filter(r=>r.ada===me):rows}
function render(){
 $("grps").innerHTML=[...new Set(mine().map(r=>r.grp))].map(g=>'<option value="'+esc(g)+'">').join("");
 const R=rows;$("s1").textContent=R.length;$("s2").textContent=R.filter(r=>r.st==="V").length;$("s3").textContent=R.filter(r=>r.st==="C").length;
 $("tb").innerHTML="<tr><th>ADA</th><th>Total</th><th>En attente</th><th>Validés</th><th>À corriger</th></tr>"+ADAS.map(a=>{const x=R.filter(r=>r.ada===a),c=s=>x.filter(r=>r.st===s).length;return"<tr><td>"+a+"</td><td>"+x.length+"</td><td>"+c("A")+"</td><td>"+c("V")+"</td><td>"+c("C")+"</td></tr>"}).join("");
 $("adaTabs").classList.toggle("hide",isADA());
 if(!isADA())$("adaTabs").innerHTML=[["","Tous ("+rows.length+")"],...ADAS.map(a=>[a,a+" ("+rows.filter(r=>r.ada===a).length+")"])].map(t=>'<button data-a="'+t[0]+'" class="'+(fa===t[0]?"on":"")+'">'+t[1]+'</button>').join("");
 const q=$("q").value.toLowerCase(),fs=$("fs").value;
 const L=mine().filter(r=>(!fa||r.ada===fa)&&(!fs||r.st===fs)&&(!q||[r.nom,r.cnib,r.grp,r.vil].join(" ").toLowerCase().includes(q)));
 $("list").innerHTML=L.length?L.map(r=>{
  let a="";
  if(isADA()&&r.st!=="V")a='<button class="sm" style="color:var(--g)" data-e="'+r.id+'">Corriger</button><button class="sm" style="color:var(--er)" data-d="'+r.id+'">Suppr.</button>';
  if(me==="DOT")a='<input id="m'+r.id+'" placeholder="Motif si à corriger" value="'+esc(r.mo)+'"><button class="sm" style="color:var(--g)" data-v="'+r.id+'">Valider</button><button class="sm" style="color:var(--er)" data-c="'+r.id+'">À corriger</button>';
  return'<div class="item"><div><b>'+esc(r.nom)+'</b><span>'+esc(r.grp)+' · '+esc(r.vil)+', '+esc(r.com)+'<br>CNIB '+esc(r.cnib)+' · '+r.sx+' · '+r.ada+(r.by?' · vérifié par '+r.by:'')+'</span>'+(r.st==="C"?'<div class="mo">À corriger : '+esc(r.mo)+'</div>':'')+'</div><div class="act"><span class="tag '+ST[r.st][1]+'">'+ST[r.st][0]+'</span>'+a+'</div></div>'}).join(""):'<p class="h">Aucune fiche pour l’instant.</p>'}
$("q").oninput=render;$("fs").onchange=render;
$("adaTabs").onclick=e=>{if(e.target.dataset.a!==undefined){fa=e.target.dataset.a;render()}};
$("list").onclick=e=>{const d=e.target.dataset,r=rows.find(x=>x.id===(d.e||d.d||d.v||d.c));if(!r)return;
 if(d.d&&confirm("Supprimer cette fiche ?")){rows=rows.filter(x=>x!==r);save();render()}
 if(d.e){F.forEach(f=>$(f).value=r[f]);document.querySelectorAll('input[name=sx]').forEach(x=>x.checked=x.value===r.sx);document.querySelectorAll('input[name=en]').forEach(x=>x.checked=x.value===r.en);
  editId=r.id;$("ftitle").textContent="Corriger la fiche";$("save").textContent="Enregistrer la correction";$("cancel").classList.remove("hide");go("vForm")}
 if(d.v){Object.assign(r,{st:"V",mo:"",by:me,u:Date.now()});save();render()}
 if(d.c){const m=$("m"+r.id).value.trim();if(!m){$("m"+r.id).focus();$("m"+r.id).placeholder="Motif obligatoire";return}
  Object.assign(r,{st:"C",mo:m,by:me,u:Date.now()});save();render()}};

$("exb").onclick=()=>{const out=mine().filter(r=>!$("exa").value||r.ada===$("exa").value);$("extx").value=JSON.stringify({app:"FAE30",from:me,rows:out});$("cp").classList.remove("hide");
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("extx").value],{type:"application/json"}));a.download="E30_"+me+($("exa").value?"_"+$("exa").value:"")+"_"+new Date().toISOString().slice(0,10)+".json";a.click()}catch(e){}};
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText($("extx").value);$("cp").textContent="Copié"}catch(e){$("extx").select()}};
$("csv").onclick=()=>{const H=["Nom du Groupement","Date","Nom et Prénom(s)","Date de naissance","Sexe","N° CNIB","Date de délivrance","Village/Quartier","Commune","Province","Région","Accepte l'engagement","ADA","Statut","Motif","Vérifié par"];
 const k=["grp","dt","nom","dn","sx","cnib","dd","vil","com","pro","reg","en","ada","st","mo","by"];
 const t="\ufeff"+[H,...rows.filter(r=>!$("exa").value||r.ada===$("exa").value).map(r=>k.map(x=>x==="st"?ST[r.st][0]:r[x]))].map(l=>l.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\n");
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download="membres_E30"+($("exa").value?"_"+$("exa").value:"")+".csv";a.click()}catch(e){}
 $("extx").value=t.slice(1);$("cp").classList.remove("hide")};
function imp(txt){const m=$("imm");m.className="msg";let d;
 try{d=JSON.parse(txt.trim())}catch(e){m.textContent="Code illisible : copiez-le en entier, sans rien ajouter.";return}
 if(d.app!=="FAE30"||!Array.isArray(d.rows)){m.textContent="Ce code n’est pas un envoi FasoAgro E30.";return}
 let n=0,u=0,s=0;
 for(const r of d.rows){if(isADA()&&r.ada!==me){s++;continue}
  const o=rows.find(x=>x.id===r.id);
  if(!o){rows.push(r);n++}else if(r.u>o.u){Object.assign(o,r);u++}}
 save();m.className="msg ok";m.textContent=n+" nouvelle(s) fiche(s), "+u+" mise(s) à jour"+(s?", "+s+" ignorée(s) (autre ADA)":"")+".";$("imtx").value="";render()}
$("imb").onclick=()=>imp($("imtx").value);
$("imf").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(imp)};
$("sync").onclick=async()=>{const m=$("syncm");m.className="msg";if(!pw)pw=$("spw").value;if(!pw){m.textContent="Entrez votre mot de passe.";return}
 m.textContent="Synchronisation…";
 try{const r=await fetch(SYNC.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({role:me,pw:pw,rows:mine()})});
  const tx=await r.text();let d;try{d=JSON.parse(tx)}catch(x){m.textContent="Réponse inattendue du serveur : "+tx.replace(/<[^>]*>/g," ").replace(/\s+/g," ").slice(0,200);return}
  if(!d.ok){if(d.error==="auth"){pw="";$("spwr").classList.remove("hide")}m.textContent=d.error==="auth"?"Mot de passe refusé par le serveur.":"Erreur : "+d.error;return}
  imp(JSON.stringify({app:"FAE30",rows:d.rows}));m.className="msg ok";m.textContent="Synchronisation terminée"+(d.skipped?" ("+d.skipped+" fiche(s) refusée(s) : CNIB en double ou fiche déjà validée).":".")}
 catch(e){m.textContent="Échec de la requête ("+(e&&e.message?e.message:e)+")."}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const s=store.get("e30_sess","");ROLES.includes(s)?start(s):showLogin();
</script></body></html>
